<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<title>Simple Calculator</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="calc" role="application" aria-label="Simple Calculator">
  <section class="display-wrap" aria-live="polite">
    <div id="expression" class="expression"></div>
    <div id="display" class="display">0</div>
  </section>
  <section class="keypad" id="keypad">
    <button class="key fn" data-key="AC" aria-label="All clear">AC</button>
    <button class="key fn" data-key="DEL" aria-label="Delete">&#9003;</button>
    <button class="key fn" data-key="%" aria-label="Percent">%</button>
    <button class="key op" data-key="÷" aria-label="Divide">&#247;</button>

    <button class="key num" data-key="7">7</button>
    <button class="key num" data-key="8">8</button>
    <button class="key num" data-key="9">9</button>
    <button class="key op" data-key="×" aria-label="Multiply">&#215;</button>

    <button class="key num" data-key="4">4</button>
    <button class="key num" data-key="5">5</button>
    <button class="key num" data-key="6">6</button>
    <button class="key op" data-key="−" aria-label="Subtract">&#8722;</button>

    <button class="key num" data-key="1">1</button>
    <button class="key num" data-key="2">2</button>
    <button class="key num" data-key="3">3</button>
    <button class="key op" data-key="+" aria-label="Add">+</button>

    <button class="key num zero" data-key="0">0</button>
    <button class="key num" data-key="00" aria-label="Double zero">00</button>
    <button class="key num" data-key="." aria-label="Decimal point">.</button>
    <button class="key eq" data-key="=" aria-label="Equals">=</button>
  </section>
</main>
<script src="js/calculator.js"></script>
<script src="js/app.js"></script>
</body>
</html>
